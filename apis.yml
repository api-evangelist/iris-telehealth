aid: iris-telehealth
name: Iris Telehealth
description: 'Iris Telehealth is an Austin, Texas telepsychiatry company, founded in
  2013, that delivers virtual behavioral health care to healthcare organizations rather
  than direct to consumers. It contracts psychiatrists, psychiatric nurse practitioners,
  LCSWs and LPCs to hospitals and health systems, community mental health centers,
  community health centers and FQHCs, and Certified Community Behavioral Health Clinics,
  covering pediatric through geriatric populations and low-acuity therapy through high-acuity
  psychiatry. Its service lines are Virtual Clinic (comprehensive care and behavioral
  health integration), On-Demand Services (24/7 emergency department psychiatry support),
  Scheduled Services (matched provider staffing), Bridge Clinic, and Iris Insights,
  an AI-enabled behavioral health analytics platform covering risk optimization, capacity
  management, a behavioral health command center and revenue cycle analytics. The company
  reports over 430 clinicians and over 210 partner organizations, and has been accredited
  by the Joint Commission for behavioral health care since 2019, earning recertification
  since. Its delivery model is deliberately technology-agnostic: Iris clinicians work
  inside each partner''s existing EMR/EHR and e-prescribing tools over HIPAA-compliant
  video, so the integration burden sits with the partner''s systems. Iris Telehealth
  publishes no public developer program, API documentation, SDKs, or machine-readable
  API contract, and operates no public GitHub organization.'
